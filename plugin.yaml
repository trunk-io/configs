version: 0.1
required_trunk_version: ">=1.7.1-beta.9"

# Applicable linters and actions will run with these runtime versions
runtimes:
  enabled:
    - go@1.24.3
    - node@22.16.0
    - python@3.10.8
    - ruby@3.4.2

lint:
  # By sourcing this plugin, repos will enable these linters
  enabled:
    - actionlint@1.7.10
    - bandit@1.9.4
    - black@26.3.0
    - buf-lint@1.31.0!
    - buildifier@8.2.1
    - cfnlint@1.46.0
    - checkov@3.2.507
    - clang-format@17.0.1
    - clang-tidy@17.0.1
    - clippy@1.71.1
    - eslint@8.56.0
    - git-diff-check
    - gofmt@1.20.4
    - golangci-lint@2.7.2
    - hadolint@2.14.0
    - isort@8.0.1
    - markdownlint@0.48.0
    - markdown-link-check@3.14.2
    - mypy@1.19.1
    - nancy@1.0.52
    - osv-scanner@2.3.1
    - oxipng@10.0.0
    - pragma-once
    - prettier@3.8.1
    - prisma@7.4.2
    - pylint@4.0.5
    - renovate@43.59.2
    - rubocop@1.39.0
    - ruff@0.15.5
    - rustfmt@1.68.2
    - semgrep@1.154.0
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - sort-package-json@3.6.1
    - sql-formatter@15.7.2
    - stylelint@17.4.0:
        packages:
          - stylelint-config-standard-scss@17.0.0
          - stylelint-config-clean-order@8.0.1
    - svgo@4.0.1
    - taplo@0.10.0
    - terrascan@1.19.9
    # Disabled until filesystem scanner initialize error resolved.
    # - trivy@0.54.1
    - trufflehog@3.92.4
    - trunk-toolbox@0.5.4
    - yamllint@1.38.0

  # Sourcing repos will have these configs available to applicable linters
  exported_configs:
    - configs:
        - configs/.flake8
        - configs/.hadolint.yaml
        - configs/.isort.cfg
        - configs/.markdownlint.yaml
        - configs/.prettierrc.yaml
        - configs/.pylintrc
        - configs/.remarkrc.yaml
        - configs/ruff.toml
        - configs/rustfmt.toml
        - configs/.shellcheckrc
        - configs/.sqlfluff
        - configs/.stylelintrc.js
        - configs/svgo.config.mjs
        - configs/.yamllint.yaml

# By sourcing this plugin, repos will enable these actions
actions:
  enabled:
    - trunk-announce
    - trunk-cache-prune
    - trunk-upgrade-available
    - trunk-check-pre-push
    - trunk-fmt-pre-commit

downloads:
  - name: trunk-analytics-cli
    downloads:
      - os:
          linux: unknown-linux
          macos: apple-darwin
        cpu:
          x86_64: x86_64
          arm_64: aarch64
        url: https://github.com/trunk-io/analytics-cli/releases/download/${version}/trunk-analytics-cli-${cpu}-${os}.tar.gz
tools:
  definitions:
    - name: trunk-analytics-cli
      download: trunk-analytics-cli
      known_good_version: 0.8.1
      shims: [trunk-analytics-cli]
      health_checks:
        - command: trunk-analytics-cli --version
          parse_regex: trunk flakytests ${semver}
  enabled:
    - gh@2.83.2
    - grpcui@1.4.3
    - gt@1.7.14
    - trunk-analytics-cli@0.12.1
